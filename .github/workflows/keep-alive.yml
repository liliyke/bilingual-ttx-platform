name: Keep Supabase Alive

# Supabase free-tier projects pause after 7 days idle. This pings the REST API
# every three days so the database stays warm. Add SUPABASE_URL and
# SUPABASE_ANON_KEY as repository secrets (Settings -> Secrets and variables).
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sSf "${{ secrets.SUPABASE_URL }}/rest/v1/scenarios?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            > /dev/null
